<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sonara Music · Painel</title><style>body{margin:0;background:#0e1020;color:#edf0ff;font:15px Inter,Arial,sans-serif}.wrap{max-width:1160px;margin:auto;padding:35px 20px}h1{margin:0}button{background:#7b48ed;color:#fff;border:0;border-radius:9px;padding:11px 15px;font-weight:800;cursor:pointer}.top{display:flex;justify-content:space-between;align-items:center;gap:15px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin:24px 0}.card,.table{background:#171b30;border:1px solid #2a3152;border-radius:14px;padding:18px}.label{color:#a4abc8;font-size:12px;text-transform:uppercase}.value{font-size:28px;font-weight:850;margin-top:10px}.good{color:#37dfae}.warn{color:#ffbd65}table{width:100%;border-collapse:collapse;margin-top:12px;font-size:13px}th,td{text-align:left;padding:13px 8px;border-bottom:1px solid #29304c}th{color:#9fa8c7;font-size:11px;text-transform:uppercase}.login{max-width:350px;margin:15vh auto;background:#171b30;padding:25px;border-radius:15px}input{width:100%;box-sizing:border-box;padding:12px;margin:13px 0;border:1px solid #444d76;background:#0f1222;color:#fff;border-radius:8px}@media(max-width:700px){.cards{grid-template-columns:repeat(2,1fr)}.table{overflow:auto}}</style><body><div id="login" class="login"><h2>Painel Sonara</h2><p>Informe a senha administrativa.</p><input id="password" type="password" placeholder="Senha"><button id="enter">Entrar</button><p id="err" class="warn"></p></div><main class="wrap" id="app" hidden><div class="top"><div><div class="label">Operação</div><h1>Sonara Music</h1></div><button id="refresh">Atualizar</button></div><section class="cards"><div class="card"><div class="label">Faturamento</div><div class="value good" id="revenue">R$ 0,00</div></div><div class="card"><div class="label">Vendas pagas</div><div class="value" id="paid">0</div></div><div class="card"><div class="label">Pix pendentes</div><div class="value warn" id="pending">0</div></div><div class="card"><div class="label">Ticket médio</div><div class="value" id="ticket">R$ 0,00</div></div></section><section class="table"><div class="label">Pedidos</div><table><thead><tr><th>Cliente</th><th>Status</th><th>Campanha</th><th>Pix gerado</th><th>Valor</th></tr></thead><tbody id="orders"></tbody></table></section></main><script>let auth='';const money=n=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(n||0));async function load(){const r=await fetch('/admin-orders',{headers:{Authorization:auth}});if(!r.ok)throw Error('Acesso não autorizado');const j=await r.json(),o=j.orders||[],paid=o.filter(x=>x.paid&&!x.refunded),sum=paid.reduce((a,x)=>a+Number(x.value||0),0);revenue.textContent=money(sum);paidEl.textContent=paid.length;pending.textContent=o.filter(x=>!x.paid).length;ticket.textContent=money(paid.length?sum/paid.length:0);orders.innerHTML=o.sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at))).map(x=>`<tr><td>${esc(x.name||'Cliente')}<br><small>${esc(x.email||'')}</small></td><td class="${x.paid?'good':'warn'}">${x.paid?'Pago':'Pendente'}</td><td>${esc(x.utmCampaign||'Direto')}</td><td>${new Date(x.created_at).toLocaleString('pt-BR')}</td><td>${money(x.value)}</td></tr>`).join('')||'<tr><td colspan="5">Nenhum pedido ainda.</td></tr>'}const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const paidEl=document.getElementById('paid');enter.onclick=async()=>{auth='Basic '+btoa(':'+password.value);try{await load();login.hidden=true;app.hidden=false}catch(e){err.textContent=e.message}};refresh.onclick=()=>load().catch(e=>alert(e.message));</script></body></html>
